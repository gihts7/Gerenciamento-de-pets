services:
  php:
    build: .
    container_name: site_progWeb
    ports:
      - "8084:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.3
    container_name: mysql_db_ProgWeb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: site_progWeb
    ports:
      - "3305:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./www/bd/site_progWeb.sql:/docker-entrypoint-initdb.d/site_progWeb.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_app_ProgWeb
    restart: always
    ports:
      - "8082:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: 1234
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  db_data:
